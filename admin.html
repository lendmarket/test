<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>관리자 | BizRental</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#1f4fd8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
</head>
<body class="admin">
  <header class="admin__bar">
    <a href="/" class="logo">Biz<span>Rental</span> <small>관리자</small></a>
    <button type="button" class="btn btn--sm btn--line" id="logoutBtn" hidden>로그아웃</button>
  </header>

  <main class="admin__main">
    <p class="admin__loading" id="loading">불러오는 중…</p>

    <!-- 로그인 -->
    <form class="panel" id="loginForm" hidden novalidate>
      <h1>관리자 로그인</h1>
      <p class="panel__sub">관리자 아이디와 비밀번호를 입력하세요.</p>
      <label>아이디<input type="text" name="id" autocomplete="username" required /></label>
      <label>비밀번호<input type="password" name="password" autocomplete="current-password" required /></label>
      <p class="form__error" role="alert"></p>
      <button class="btn btn--block" type="submit">로그인</button>
    </form>

    <!-- 관리자 대시보드 -->
    <section id="dashboard" hidden>
      <div class="notice" id="defaultWarn" hidden>
        ⚠️ 기본 비밀번호(123456)를 사용 중입니다. 보안을 위해 아래에서 바로 변경해 주세요.
      </div>

      <div class="panel">
        <h2>관리자 계정</h2>
        <dl class="info">
          <dt>아이디</dt><dd id="infoId"></dd>
        </dl>
      </div>

      <form class="panel" id="pwForm" novalidate>
        <h2>비밀번호 변경</h2>
        <label>현재 비밀번호<input type="password" name="current" autocomplete="current-password" required /></label>
        <label>새 비밀번호<input type="password" name="next" autocomplete="new-password" minlength="8" required /></label>
        <label>새 비밀번호 확인<input type="password" name="confirm" autocomplete="new-password" minlength="8" required /></label>
        <p class="panel__hint">8자 이상, 영문과 숫자를 모두 포함해 주세요. 변경하면 다른 기기의 로그인은 모두 해제됩니다.</p>
        <p class="form__error" role="alert"></p>
        <p class="form__ok" role="status"></p>
        <button class="btn" type="submit">비밀번호 변경</button>
      </form>
    </section>
  </main>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
